name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          cd forgery-vcr
          npm install

      - name: Build
        run: |
          cd forgery-vcr
          npm run build

      - name: Prepare site
        run: |
          mkdir -p _site/assets _site/undergraduate _site/projects/ForgeryVCR
          cp index.html styles.css script.js _site/
          cp -R assets/. _site/assets/
          cp -R undergraduate/. _site/undergraduate/
          cp -R forgery-vcr/dist/. _site/projects/ForgeryVCR/
          touch _site/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
